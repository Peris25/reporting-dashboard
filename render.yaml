services:
  - type: web
    name: reporting-dashboard
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reporting-dashboard-db
          property: connectionString
      - key: USE_DATABASE
        value: "true"
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false

databases:
  - name: reporting-dashboard-db
    databaseName: reporting_dashboard
    user: reporting_dashboard
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
    ipAllowList: []
